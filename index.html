
<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontier Quartermaster</title>
<style>
:root {
  --dark:#261a15;
  --brown:#473027;
  --gold:#b58b49;
  --paper:#f2e4c9;
  --light:#fff9ed;
  --red:#a72f27;
  --green:#356c46;
}
*{box-sizing:border-box}
body{margin:0;background:#d6c2a0;color:var(--dark);font:15px Georgia,serif}
header{background:var(--dark);color:var(--paper);padding:18px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px}
h1{margin:0;font-size:25px;letter-spacing:2px}
h2{margin:12px 0}
button,select,input{font:inherit;border:1px solid #9c815f;border-radius:4px;padding:8px;background:var(--light);color:var(--dark)}
button{cursor:pointer}
button:hover{filter:brightness(.92)}
button.primary{background:var(--brown);color:white}
button.danger{background:var(--red);color:white}
button.good{background:var(--green);color:white}
button:disabled{opacity:.5;cursor:not-allowed}
nav{display:flex;gap:8px;background:#473027;padding:10px 20px;flex-wrap:wrap}
nav button{background:#e6d1a7}
nav button.active{background:var(--gold);font-weight:bold}
main{padding:22px;max-width:1700px;margin:auto}
.panel{background:var(--paper);border:2px solid #92724d;box-shadow:0 3px 8px #604c3822;padding:16px;margin-bottom:16px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.scroll{overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;background:var(--light)}
th{position:sticky;top:0;background:var(--brown);color:#fff2d8;text-align:left;z-index:1}
td,th{border:1px solid #b8a07a;padding:9px;vertical-align:top}
tr:nth-child(even) td{background:#f0e2c9}
.muted{color:#78634f}
.red{background:#f4c8bf!important;color:#761b18}
.green{background:#d9ead7!important;color:#225734}
.chip{display:inline-block;border-radius:3px;padding:5px;margin:2px;border:1px solid #b9a27c}
.small{font-size:12px}
.cell{min-width:155px}
.cell select{width:100%;max-width:165px}
.issue{display:flex;flex-direction:column;gap:5px;padding:6px;margin-bottom:5px;background:#e8b6ac;border-left:4px solid var(--red)}
.issue button{padding:4px;font-size:12px}
.issue.done{background:#d9ead7;border-left-color:var(--green)}
.issue.lost{background:#f4c8bf}
.searchbox{width:min(370px,100%)}
.actions{display:flex;gap:4px;flex-wrap:wrap}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#f9edda;border:1px solid #b49a73;padding:12px;min-width:140px}
#message{position:fixed;bottom:15px;right:15px;max-width:420px;background:#382720;color:white;padding:14px;display:none;z-index:10}
#login{max-width:500px;margin:70px auto}
.hidden{display:none!important}
.tag{font-size:11px;background:#e4d1af;padding:2px 5px}
input[type=date]{min-width:150px}
@media(max-width:800px){main{padding:8px}header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header>
  <h1>✦ FRONTIER QUARTERMASTER</h1>
  <div id="identity">საწყობის აღრიცხვა</div>
</header>
<div id="login" class="panel">
  <h2>ავტორიზაცია</h2>
  <p>მხოლოდ სამი დაშვებული მომხმარებლისთვის.</p>
  <form id="loginForm">
    <div class="toolbar">
      <select id="username" required autocomplete="username">
        <option value="">აირჩიე მომხმარებელი</option>
        <option value="Billy Westwood">Billy Westwood</option>
        <option value="tyler Westwood">tyler Westwood</option>
        <option value="Satoshi Nikamoto">Satoshi Nikamoto</option>
      </select>
      <input id="password" type="password" placeholder="პაროლი" required autocomplete="current-password">
      <button class="primary">შესვლა</button>
    </div>
  </form>
  <p class="small muted">ანგარიშებს Supabase-ის ადმინისტრატორი ქმნის. რეგისტრაცია დახურულია.</p>
</div>
<div id="app" class="hidden">
  <nav>
    <button data-page="soldiers" class="active">ჯარისკაცები</button>
    <button data-page="stock">საწყობი</button>
    <button data-page="lost">დაკარგული</button>
    <button data-page="summary">დღის შეჯამება</button>
    <button id="logout">გასვლა</button>
  </nav>
  <main><div id="content"></div></main>
</div>
<div id="message"></div>
<script src="config.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const conf=window.APP_CONFIG||{};
const valid=conf.SUPABASE_URL?.startsWith('https://')&&conf.SUPABASE_ANON_KEY&&!conf.SUPABASE_ANON_KEY.startsWith('PASTE_');
const sb=valid?createClient(conf.SUPABASE_URL,conf.SUPABASE_ANON_KEY):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

let soldierSearch='',selectedDay=day(),page='soldiers',items=[],soldiers=[],issues=[],events=[],me='',busy=false;

function msg(t){
  $('#message').textContent=t;
  $('#message').style.display='block';
  setTimeout(()=>$('#message').style.display='none',4500);
}
function err(e){msg('შეცდომა: '+(e?.message||e))}
function setBusy(v){
  busy=v;
  document.querySelectorAll('#content button').forEach(b=>b.disabled=v);
}
async function load(){
  const [a,b,c,d]=await Promise.all([
    sb.from('items').select('*').order('name'),
    sb.from('soldiers').select('*').order('name'),
    sb.from('issues').select('*').order('issued_at'),
    sb.from('stock_events').select('*').order('created_at',{ascending:false})
  ]);
  for(const x of [a,b,c,d])if(x.error)throw x.error;
  items=a.data;soldiers=b.data;issues=c.data;events=d.data;
  render();
}
async function action(kind,args={}){
  if(busy)return;
  setBusy(true);
  try{
    const {error}=await sb.rpc('perform_action',{
      p_action:kind,
      p_item:args.item||null,
      p_soldier:args.soldier||null,
      p_issue:args.issue||null,
      p_qty:args.qty||null,
      p_name:args.name||null,
      p_day:args.day||null
    });
    if(error)throw error;
    await load();
    msg('შენახულია ✓');
  }catch(e){err(e);setBusy(false)}
}
const itemName=id=>items.find(i=>i.id===id)?.name||'—';
const soldierName=id=>soldiers.find(s=>s.id===id)?.name||'—';
const available=i=>i.initial_qty+i.added_qty-issues.filter(x=>x.item_id===i.id&&x.status!=='returned').length;
const displayDate=d=>d?d.split('-').reverse().join('.'):'';

function dateToolbar(){
  return `<div class="toolbar">
    <b>თარიღი:</b>
    <input id="day" type="date" value="${esc(selectedDay)}" max="${day()}">
    <button id="today">დღეს</button>
    <span class="muted">ძველი დღეები ინახება; ახალი გაცემა მხოლოდ დღეს შეიძლება.</span>
  </div>`;
}
function selectIssue(s,slot){
  let opts=items.filter(i=>available(i)>0).map(i=>`<option value="${i.id}">${esc(i.name)} (${available(i)} დარჩა)</option>`).join('');
  return `<div class="cell green"><select class="give" data-s="${s.id}">
    <option value="">+ გაცემა ${slot}</option>${opts}
  </select></div>`;
}
function issueCell(x){
  return `<div class="issue">
    <b>${esc(itemName(x.item_id))}</b>
    <span class="small">გასცა: ${esc(x.issued_by)} · ${new Date(x.issued_at).toLocaleTimeString('ka-GE',{hour:'2-digit',minute:'2-digit'})}</span>
    <div class="actions">
      <button class="good resolve" data-status="returned" data-id="${x.id}">დაბრუნდა</button>
      <button class="danger resolve" data-status="lost" data-id="${x.id}">დაიკარგა</button>
    </div>
  </div>`;
}
function historyCell(x){
  let status=x.status==='returned'?'დაბრუნდა':'დაიკარგა';
  return `<div class="issue ${x.status==='returned'?'done':'lost'}">
    <b>${esc(itemName(x.item_id))}</b>
    <span class="small">${status}</span>
  </div>`;
}
function soldiersPage(){
  const active=soldiers.filter(s=>s.active||issues.some(x=>x.soldier_id===s.id&&x.issue_day===selectedDay));
  return `<section class="panel">
    <h2>ჯარისკაცების ყოველდღიური ჟურნალი</h2>
    ${dateToolbar()}
    <div class="toolbar">
      <input id="soldierSearch" class="searchbox" placeholder="🔎 მოძებნე ჯარისკაცი სახელით ან გვარით" value="${esc(soldierSearch)}">
      <span class="muted">ჯარისკაცები ავტომატურად იტვირთება ბაზიდან · 1 არჩევანი = 1 ცალი</span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>სახელი და გვარი</th>
          ${[1,2,3,4].map(n=>`<th>აღჭურვილობა ${n}</th>`).join('')}
          <th>სწრაფი მოქმედებები</th>
        </tr></thead>
        <tbody>
          ${active.filter(s=>s.name.toLocaleLowerCase().includes(soldierSearch.toLocaleLowerCase())).map(s=>{
            let arr=issues.filter(x=>x.soldier_id===s.id&&x.issue_day===selectedDay&&x.status==='out');
            let finished=issues.filter(x=>x.soldier_id===s.id&&x.issue_day===selectedDay&&x.status!=='out');
            return `<tr>
              <td><b>${esc(s.name)}</b><div class="small muted">${s.active?'აქტიური':'სიიდან ამოღებული'}</div></td>
              ${[0,1,2,3].map(n=>`<td class="cell">
                ${arr[n]?issueCell(arr[n]):finished[n-arr.length]?historyCell(finished[n-arr.length]):s.active&&selectedDay===day()?selectIssue(s,n+1):'<span class="chip green">თავისუფალია</span>'}
              </td>`).join('')}
              <td>
                <div class="actions">
                  <button class="good bulk" data-status="all_returned" data-s="${s.id}" ${arr.length?'':'disabled'}>ყველას დაბრუნება</button>
                  <button class="danger bulk" data-status="all_lost" data-s="${s.id}" ${arr.length?'':'disabled'}>ყველა დაკარგულად</button>
                </div>
                <div class="small muted">დასაბრუნებელია: ${arr.length}</div>
                ${finished.map(x=>`<div class="small">${esc(itemName(x.item_id))}: ${x.status==='returned'?'დაბრუნდა':'დაიკარგა'}</div>`).join('')}
              </td>
            </tr>`;
          }).join('')||'<tr><td colspan="6">ჯარისკაცი ვერ მოიძებნა</td></tr>'}
        </tbody>
      </table>
    </div>
  </section>`;
}
function stockPage(){
  return `<section class="panel">
    <h2>საწყობის აღრიცხვა</h2>
    <p class="muted">საწყისი რაოდენობა უცვლელია (0-დან იწყება). მარაგის მიღება მხოლოდ „დამატება“ მოქმედებით ხდება და აღირიცხება.</p>
    <div class="toolbar">
      <input id="newItem" placeholder="ახალი ნივთის დასახელება">
      <button id="addItem">ნივთის დამატება</button>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>ნივთი</th><th>საწყისი</th><th>დამატებული</th><th>გაცემული / დასაბრუნებელი</th><th>დაკარგული</th><th>დარჩენილი</th><th>მარაგის მიღება</th></tr></thead>
      <tbody>${items.map(i=>{
        let out=issues.filter(x=>x.item_id===i.id&&x.status==='out').length;
        let lost=issues.filter(x=>x.item_id===i.id&&x.status==='lost').length;
        return `<tr>
          <td><b>${esc(i.name)}</b></td>
          <td>${i.initial_qty}</td><td>${i.added_qty}</td><td>${out}</td><td>${lost}</td>
          <td class="${available(i)>0?'green':'red'}"><b>${available(i)}</b></td>
          <td><input class="qty" id="q-${i.id}" type="number" min="1" step="1" placeholder="რაოდენობა" style="width:110px"><button class="stockAdd" data-id="${i.id}">+ დამატება</button></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </section>`;
}
function lostPage(){
  let lost=issues.filter(x=>x.status==='lost'&&x.resolved_day===selectedDay);
  return `<section class="panel">
    <h2>დაკარგული ნივთები</h2>
    ${dateToolbar()}
    <p>ამ დღეს დაკარგულად დაფიქსირებული ნივთები: <b>${lost.length}</b></p>
    ${reportTable(lost)}
  </section>`;
}
function reportTable(rows){
  return `<div class="scroll"><table>
    <thead><tr><th>ჯარისკაცი</th><th>ნივთი</th><th>გაცემის თარიღი</th><th>გასცა</th><th>სტატუსი</th><th>დაფიქსირების დრო</th><th>დააფიქსირა</th></tr></thead>
    <tbody>${rows.map(x=>`<tr>
      <td>${esc(soldierName(x.soldier_id))}</td>
      <td>${esc(itemName(x.item_id))}</td>
      <td>${displayDate(x.issue_day)}</td>
      <td>${esc(x.issued_by)}</td>
      <td class="${x.status==='lost'?'red':x.status==='returned'?'green':''}">${x.status==='out'?'დასაბრუნებელია':x.status==='lost'?'დაიკარგა':'დაბრუნდა'}</td>
      <td>${x.resolved_at?new Date(x.resolved_at).toLocaleString('ka-GE'):'—'}</td>
      <td>${esc(x.resolved_by||'—')}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}
function summaryPage(){
  let issued=issues.filter(x=>x.issue_day===selectedDay);
  let returned=issues.filter(x=>x.resolved_day===selectedDay&&x.status==='returned');
  let lost=issues.filter(x=>x.resolved_day===selectedDay&&x.status==='lost');
  let out=issued.filter(x=>x.status==='out');
  return `<section class="panel">
    <h2>დღის შეჯამება</h2>${dateToolbar()}
    <div class="summary">${[['გაცემულია',issued.length],['დაბრუნდა',returned.length],['დაიკარგა',lost.length],['ამ დღის დასაბრუნებელი',out.length]].map(x=>`<div class="stat"><div>${x[0]}</div><h2>${x[1]}</h2></div>`).join('')}</div>
    <h2>ამ დღეს გაცემული</h2>${reportTable(issued)}
    <h2>ამ დღეს დაბრუნებული (მათ შორის ძველი გაცემები)</h2>${reportTable(returned)}
    <h2>ამ დღეს დაკარგული</h2>${reportTable(lost)}
    <h2>ჯერ დასაბრუნებელია (ყველა თარიღიდან)</h2>${reportTable(issues.filter(x=>x.status==='out'))}
  </section>`;
}
function render(){
  if(!$('#app').classList.contains('hidden')){
    $('#content').innerHTML=page==='stock'?stockPage():page==='lost'?lostPage():page==='summary'?summaryPage():soldiersPage();
    document.querySelectorAll('nav [data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
  }
}
$('#content').addEventListener('input',e=>{
  if(e.target.id==='soldierSearch'){
    soldierSearch=e.target.value;
    const pos=e.target.selectionStart;
    render();
    const input=$('#soldierSearch');
    input.focus();
    input.setSelectionRange(pos,pos);
  }
});
$('#content').addEventListener('change',async e=>{
  if(e.target.id==='day'){selectedDay=e.target.value;render()}
  if(e.target.classList.contains('give')&&e.target.value){
    let id=e.target.value,s=e.target.dataset.s;
    e.target.value='';
    await action('issue',{item:id,soldier:s,day:selectedDay});
  }
});
$('#content').addEventListener('click',async e=>{
  let b=e.target.closest('button');
  if(!b)return;
  if(b.id==='today'){
    selectedDay=day();render();
  }else if(b.id==='addItem'){
    let name=$('#newItem').value.trim();
    if(name)await action('add_item',{name});
  }else if(b.classList.contains('stockAdd')){
    let qty=Number($('#q-'+b.dataset.id).value);
    if(Number.isInteger(qty)&&qty>0&&confirm(`საწყობში ${qty} ცალის დამატება?`))
      await action('stock',{item:b.dataset.id,qty});
  }else if(b.classList.contains('resolve')){
    if(confirm(b.dataset.status==='lost'?'დაკარგულად მონიშვნა?':'დაბრუნების დადასტურება?'))
      await action(b.dataset.status,{issue:b.dataset.id});
  }else if(b.classList.contains('bulk')){
    if(confirm('ყველა ჯერ დასაბრუნებელი ნივთის სტატუსის შეცვლა?'))
      await action(b.dataset.status,{soldier:b.dataset.s,day:selectedDay});
  }
});
document.querySelectorAll('nav [data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();
  if(!sb)return msg('ჯერ config.js-ში Supabase-ის პარამეტრები შეავსე');
  let email=conf.LOGIN_EMAILS?.[$('#username').value];
  if(!email)return msg('config.js-ში ამ მომხმარებლის ელფოსტა ჯერ არ არის მითითებული');
  let {error}=await sb.auth.signInWithPassword({email,password:$('#password').value});
  if(error)err(error);
  else await start();
};
async function start(){
  if(!sb){msg('Supabase ჯერ არ არის დაკავშირებული: შეავსე config.js');return}
  let {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  let {data:name,error}=await sb.rpc('my_name');
  if(error||!name){
    await sb.auth.signOut();
    return err('ამ ელფოსტას წვდომა არ აქვს. შეამოწმე allowed_users.');
  }
  me=name;
  $('#identity').textContent=me;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  try{await load()}catch(e){err(e)}
}
start();
setInterval(async()=>{
  if(!$('#app').classList.contains('hidden')&&!busy){
    try{await load()}catch(e){console.warn(e)}
  }
},15000);
</script>
</body>
</html>
