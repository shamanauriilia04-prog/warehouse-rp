
<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontier Quartermaster</title>
<style>
:root{
  --brown:#473027;
  --paper:#f2e4c9;
  --light:#fff9ed;
  --red:#a72f27;
  --green:#356c46;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#d6c2a0;
  color:#261a15;
  font:15px Georgia,serif;
}
header{
  background:#261a15;
  color:var(--paper);
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}
h1{font-size:24px;margin:0}
h2{margin:8px 0 14px}
button,input,select{
  font:inherit;
  padding:8px;
  border:1px solid #9c815f;
  border-radius:4px;
  background:var(--light);
  color:#261a15;
}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.primary{background:var(--brown);color:white}
.good{background:var(--green);color:white}
.danger{background:var(--red);color:white}
nav{
  background:var(--brown);
  padding:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
nav button{background:#e6d1a7}
nav button.active{
  background:#b58b49;
  font-weight:bold;
}
main{
  padding:20px;
  max-width:1600px;
  margin:auto;
}
.panel{
  background:var(--paper);
  border:2px solid #92724d;
  padding:16px;
  margin-bottom:16px;
}
.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  align-items:center;
  margin:12px 0;
}
.scroll{overflow:auto;max-height:72vh}
table{
  border-collapse:collapse;
  width:100%;
  background:var(--light);
}
td,th{
  border:1px solid #b8a07a;
  padding:8px;
  text-align:left;
  vertical-align:top;
}
th{
  background:var(--brown);
  color:white;
  position:sticky;
  top:0;
}
tr:nth-child(even) td{background:#f0e2c9}
.muted{color:#78634f}
.small{font-size:12px}
.red{background:#f4c8bf!important;color:#761b18}
.green{background:#d9ead7!important;color:#225734}
.issue{
  padding:7px;
  margin-bottom:5px;
  border-left:4px solid var(--red);
  background:#e8b6ac;
  min-width:150px;
}
.issue.returned{
  background:#d9ead7;
  border-color:var(--green);
}
.issue.lost{background:#f4c8bf}
.issue button{
  font-size:12px;
  padding:5px;
  margin:3px 2px 0 0;
}
.cell{min-width:160px}
.cell select{width:100%}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.hidden{display:none!important}
#login{max-width:520px;margin:70px auto}
#message{
  position:fixed;
  bottom:15px;
  right:15px;
  background:#382720;
  color:white;
  padding:13px;
  display:none;
  max-width:500px;
  z-index:10;
  white-space:pre-wrap;
}
.stat{
  display:inline-block;
  background:#f9edda;
  border:1px solid #b49a73;
  padding:12px;
  margin:5px;
}
.stat strong{display:block;font-size:22px}
.search{width:min(360px,100%)}
@media(max-width:800px){
  main{padding:8px}
  header{display:block}
  h1{font-size:19px}
}
</style>
</head>
<body>

<header>
  <h1>✦ FRONTIER QUARTERMASTER</h1>
  <span id="identity">საწყობის აღრიცხვა</span>
</header>

<div id="login" class="panel">
  <h2>ავტორიზაცია</h2>
  <form id="loginForm" class="toolbar">
    <select id="username" required>
      <option value="">აირჩიე მომხმარებელი</option>
      <option>Billy Westwood</option>
      <option>tyler Westwood</option>
      <option>Satoshi Nikamoto</option>
    </select>
    <input id="password" type="password"
           placeholder="პაროლი" required>
    <button class="primary">შესვლა</button>
  </form>
</div>

<div id="app" class="hidden">
  <nav>
    <button data-page="stock" class="active">საწყობი</button>
    <button data-page="soldiers">ჯარისკაცები</button>
    <button data-page="lost">დაკარგული</button>
    <button data-page="summary">დღის შეჯამება</button>
    <button id="logout">გასვლა</button>
  </nav>
  <main id="content"></main>
</div>

<div id="message"></div>
<script src="config.js"></script>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const conf=window.APP_CONFIG||{};
const sb=conf.SUPABASE_URL&&conf.SUPABASE_ANON_KEY
  ?createClient(conf.SUPABASE_URL,conf.SUPABASE_ANON_KEY)
  :null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[c]));

const day=()=>new Intl.DateTimeFormat('en-CA',{
  timeZone:'Europe/Paris',
  year:'numeric',
  month:'2-digit',
  day:'2-digit'
}).format(new Date());

const clock=t=>t?new Date(t).toLocaleString('ka-GE',{
  timeZone:'Europe/Paris',
  day:'2-digit',
  month:'2-digit',
  year:'numeric',
  hour:'2-digit',
  minute:'2-digit'
}):'—';

let selectedDay=day();
let page='stock';
let items=[],soldiers=[],issues=[];
let busy=false,loading=false;
let soldierSearch='',stockSearch='',showArchived=false;

const itemName=id=>items.find(i=>i.id===id)?.name||'—';
const soldierName=id=>soldiers.find(s=>s.id===id)?.name||'—';

const used=id=>issues.filter(x=>
  x.item_id===id&&['out','lost'].includes(x.status)
).length;

const available=i=>
  Number(i.initial_qty||0)+Number(i.added_qty||0)-used(i.id);

function notice(t){
  $('#message').textContent=t;
  $('#message').style.display='block';
  clearTimeout(notice.timer);
  notice.timer=setTimeout(()=>{
    $('#message').style.display='none';
  },5500);
}

function setBusy(v){
  busy=v;
  document.querySelectorAll('#content button,#content select')
    .forEach(x=>x.disabled=v);
}

async function reload(){
  if(loading)return;
  loading=true;
  try{
    const r=await Promise.all([
      sb.from('items').select('*').order('name'),
      sb.from('soldiers').select('*').order('name'),
      sb.from('issues').select('*').order('issued_at')
    ]);
    for(const x of r){
      if(x.error)throw x.error;
    }
    [items,soldiers,issues]=r.map(x=>x.data||[]);
    render();
  }finally{
    loading=false;
  }
}

async function act(kind,args={},edit=false){
  if(busy)return;
  setBusy(true);
  try{
    const r=edit
      ?await sb.rpc('warehouse_edit',{
        p_action:kind,
        p_item:args.item||null,
        p_issue:args.issue||null,
        p_qty:args.qty??null
      })
      :await sb.rpc('perform_action',{
        p_action:kind,
        p_item:args.item||null,
        p_soldier:args.soldier||null,
        p_issue:args.issue||null,
        p_qty:args.qty??null,
        p_name:args.name||null,
        p_day:args.day||null
      });

    if(r.error)throw r.error;
    await reload();
    notice('შენახულია ✓');
  }catch(e){
    notice('შეცდომა: '+(e.message||e));
  }finally{
    setBusy(false);
  }
}

function dateToolbar(){
  return `<div class="toolbar">
    <b>თარიღი:</b>
    <input type="date" id="day"
      value="${esc(selectedDay)}" max="${day()}">
    <button id="today">დღეს</button>
    <span id="clock" class="muted"></span>
  </div>`;
}

function stockPage(){
  const list=items.filter(i=>
    (showArchived||!i.archived)&&
    i.name.toLocaleLowerCase().includes(
      stockSearch.toLocaleLowerCase()
    )
  );

  return `<section class="panel">
    <h2>საწყობი</h2>
    <div class="toolbar">
      <input id="newItem" placeholder="ახალი ნივთი">
      <button id="addItem" class="primary">დამატება</button>
      <input id="stockSearch" class="search"
        placeholder="🔎 ნივთის ძებნა"
        value="${esc(stockSearch)}">
      <label>
        <input type="checkbox" id="showArchived"
          ${showArchived?'checked':''}>
        წაშლილებიც
      </label>
    </div>
    <p class="muted small">
      რაოდენობა პირდაპირ საწყის ნაშთს ემატება.
      წაშლილი ნივთის ისტორია ინახება.
    </p>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>ნივთი</th>
          <th>საწყისი ნაშთი</th>
          <th>დასაბრუნებელი</th>
          <th>დაკარგული</th>
          <th>დარჩენილი</th>
          <th>მოქმედება</th>
        </tr></thead>
        <tbody>
        ${list.map(i=>`<tr>
          <td>
            <b>${esc(i.name)}</b>
            ${i.archived?
              '<span class="small muted">(წაშლილი)</span>':''}
          </td>
          <td>${Number(i.initial_qty||0)+Number(i.added_qty||0)}</td>
          <td>${issues.filter(x=>
            x.item_id===i.id&&x.status==='out').length}</td>
          <td>${issues.filter(x=>
            x.item_id===i.id&&x.status==='lost').length}</td>
          <td class="${available(i)>0?'green':'red'}">
            <b>${available(i)}</b>
          </td>
          <td>
            ${i.archived?
              `<button class="restoreItem" data-id="${i.id}">
                აღდგენა
              </button>`:
              `<input id="q-${i.id}" type="number"
                min="1" max="100000" step="1"
                placeholder="რაოდენობა"
                style="width:110px">
              <button class="addStock" data-id="${i.id}">
                + დამატება
              </button>
              <button class="danger archiveItem" data-id="${i.id}">
                წაშლა
              </button>`}
          </td>
        </tr>`).join('')||
          '<tr><td colspan="6">ნივთები არ მოიძებნა</td></tr>'}
        </tbody>
      </table>
    </div>
  </section>`;
}

function issueCard(x){
  const status=x.status==='out'
    ?'დასაბრუნებელია'
    :x.status==='returned'
      ?'დაბრუნდა'
      :'დაიკარგა';

  return `<div class="issue ${x.status==='out'?'':x.status}">
    <b>${esc(itemName(x.item_id))}</b>
    <div class="small">${status} · ${clock(x.issued_at)}</div>
    ${x.status==='out'?`
      <button class="good resolve"
        data-id="${x.id}" data-status="returned">
        დაბრუნდა
      </button>
      <button class="danger resolve"
        data-id="${x.id}" data-status="lost">
        დაიკარგა
      </button>`:''}
    <button class="cancelIssue" data-id="${x.id}"
      title="შეცდომით გაცემული ჩანაწერის გაუქმება">
      ✕ წაშლა
    </button>
  </div>`;
}

function soldiersPage(){
  const list=soldiers.filter(s=>
    (s.active||issues.some(x=>
      x.soldier_id===s.id&&x.issue_day===selectedDay
    ))&&s.name.toLocaleLowerCase().includes(
      soldierSearch.toLocaleLowerCase()
    )
  );

  return `<section class="panel">
    <h2>ჯარისკაცების ჟურნალი</h2>
    ${dateToolbar()}
    <div class="toolbar">
      <input id="soldierSearch" class="search"
        placeholder="🔎 ჯარისკაცის ძებნა"
        value="${esc(soldierSearch)}">
      <span class="muted small">
        წითელი — გაცემული · მწვანე — დაბრუნებული
      </span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>ჯარისკაცი</th>
          ${[1,2,3,4].map(n=>
            `<th>აღჭურვილობა ${n}</th>`).join('')}
          <th>ყველა ნივთი</th>
        </tr></thead>
        <tbody>
        ${list.map(s=>{
          const rows=issues.filter(x=>
            x.soldier_id===s.id&&
            x.issue_day===selectedDay&&
            x.status!=='cancelled'
          );
          const open=rows.filter(x=>x.status==='out');
          const recent=rows.slice(-4).reverse();

          return `<tr>
            <td><b>${esc(s.name)}</b></td>
            ${[0,1,2,3].map(n=>`<td class="cell">
              ${recent[n]?
                issueCard(recent[n]):
                s.active&&selectedDay===day()&&open.length<4?
                `<select class="give" data-s="${s.id}">
                  <option value="">+ გაცემა</option>
                  ${items.filter(i=>
                    !i.archived&&available(i)>0
                  ).map(i=>`<option value="${i.id}">
                    ${esc(i.name)} (${available(i)})
                  </option>`).join('')}
                </select>`:'—'}
            </td>`).join('')}
            <td>
              <div class="small">
                დასაბრუნებელია: <b>${open.length}</b>
              </div>
              <div class="actions">
                <button class="good bulk"
                  data-status="all_returned"
                  data-s="${s.id}"
                  ${open.length?'':'disabled'}>
                  ყველას დაბრუნება
                </button>
                <button class="danger bulk"
                  data-status="all_lost"
                  data-s="${s.id}"
                  ${open.length?'':'disabled'}>
                  ყველა დაკარგულად
                </button>
              </div>
              ${rows.length>4?
                `<div class="small muted">
                  სხვა ჩანაწერები: ${rows.length-4}
                  (იხილე შეჯამება)
                </div>`:''}
            </td>
          </tr>`;
        }).join('')||
          '<tr><td colspan="6">ჯარისკაცი ვერ მოიძებნა</td></tr>'}
        </tbody>
      </table>
    </div>
  </section>`;
}

function report(rows){
  return `<div class="scroll">
    <table>
      <thead><tr>
        <th>ჯარისკაცი</th>
        <th>ნივთი</th>
        <th>გაცემის დრო</th>
        <th>გასცა</th>
        <th>სტატუსი</th>
        <th>განახლების დრო</th>
        <th>მოქმედება</th>
      </tr></thead>
      <tbody>
      ${rows.map(x=>`<tr>
        <td>${esc(soldierName(x.soldier_id))}</td>
        <td>${esc(itemName(x.item_id))}</td>
        <td>${clock(x.issued_at)}</td>
        <td>${esc(x.issued_by)}</td>
        <td class="${x.status==='lost'?'red':
          x.status==='returned'?'green':''}">
          ${x.status==='out'?'დასაბრუნებელია':
            x.status==='lost'?'დაიკარგა':'დაბრუნდა'}
        </td>
        <td>${clock(x.resolved_at)}</td>
        <td>
          <button class="cancelIssue" data-id="${x.id}">
            ✕ წაშლა
          </button>
        </td>
      </tr>`).join('')||
        '<tr><td colspan="7">ჩანაწერები არ არის</td></tr>'}
      </tbody>
    </table>
  </div>`;
}

function lostPage(){
  const r=issues.filter(x=>
    x.status==='lost'&&x.resolved_day===selectedDay
  );
  return `<section class="panel">
    <h2>დაკარგული ნივთები</h2>
    ${dateToolbar()}
    <p>დაკარგულია: ${r.length}</p>
    ${report(r)}
  </section>`;
}

function summaryPage(){
  const today=issues.filter(x=>
    x.issue_day===selectedDay&&x.status!=='cancelled'
  );
  const returned=issues.filter(x=>
    x.resolved_day===selectedDay&&x.status==='returned'
  );
  const lost=issues.filter(x=>
    x.resolved_day===selectedDay&&x.status==='lost'
  );

  return `<section class="panel">
    <h2>დღის შეჯამება</h2>
    ${dateToolbar()}
    ${[
      ['გაცემულია',today.length],
      ['დაბრუნდა',returned.length],
      ['დაიკარგა',lost.length],
      ['დასაბრუნებელია',
        issues.filter(x=>x.status==='out').length]
    ].map(x=>`<div class="stat">
      ${x[0]}<strong>${x[1]}</strong>
    </div>`).join('')}
    <h2>ჩანაწერები</h2>
    ${report(today)}
  </section>`;
}

function render(){
  if($('#app').classList.contains('hidden'))return;

  $('#content').innerHTML=
    page==='stock'?stockPage():
    page==='soldiers'?soldiersPage():
    page==='lost'?lostPage():summaryPage();

  document.querySelectorAll('nav [data-page]')
    .forEach(b=>b.classList.toggle(
      'active',b.dataset.page===page
    ));
  tick();
}

function tick(){
  if($('#clock')){
    $('#clock').textContent='ახლა: '+clock(new Date());
  }
}
setInterval(tick,1000);

$('#content').addEventListener('input',e=>{
  if(['soldierSearch','stockSearch'].includes(e.target.id)){
    const id=e.target.id;
    const pos=e.target.selectionStart;

    if(id==='soldierSearch'){
      soldierSearch=e.target.value;
    }else{
      stockSearch=e.target.value;
    }

    render();
    const el=$('#'+id);
    el?.focus();
    el?.setSelectionRange(pos,pos);
  }
});

$('#content').addEventListener('change',async e=>{
  if(e.target.id==='day'){
    selectedDay=e.target.value;
    render();
  }else if(e.target.id==='showArchived'){
    showArchived=e.target.checked;
    render();
  }else if(e.target.classList.contains('give')&&e.target.value){
    const item=e.target.value;
    const soldier=e.target.dataset.s;
    e.target.value='';
    await act('issue',{item,soldier,day:selectedDay});
  }
});

$('#content').addEventListener('click',async e=>{
  const b=e.target.closest('button');
  if(!b||busy)return;

  if(b.id==='today'){
    selectedDay=day();
    render();

  }else if(b.id==='addItem'){
    const name=$('#newItem').value.trim();
    if(name.length>1){
      await act('add_item',{name});
    }else{
      notice('შეიყვანე ნივთის დასახელება');
    }

  }else if(b.classList.contains('addStock')){
    const qty=Number($('#q-'+b.dataset.id).value);
    if(Number.isInteger(qty)&&qty>0&&qty<=100000){
      await act('stock',{item:b.dataset.id,qty},true);
    }else{
      notice('შეიყვანე სწორი რაოდენობა');
    }

  }else if(b.classList.contains('archiveItem')){
    await act('archive_item',{item:b.dataset.id},true);

  }else if(b.classList.contains('restoreItem')){
    await act('restore_item',{item:b.dataset.id},true);

  }else if(b.classList.contains('cancelIssue')){
    await act('cancel_issue',{issue:b.dataset.id},true);

  }else if(b.classList.contains('resolve')){
    await act(b.dataset.status,{issue:b.dataset.id});

  }else if(b.classList.contains('bulk')){
    await act(b.dataset.status,{
      soldier:b.dataset.s,
      day:selectedDay
    });
  }
});

document.querySelectorAll('nav [data-page]')
  .forEach(b=>b.addEventListener('click',()=>{
    page=b.dataset.page;
    render();
  }));

$('#logout').onclick=async()=>{
  await sb.auth.signOut();
  location.reload();
};

$('#loginForm').onsubmit=async e=>{
  e.preventDefault();

  if(!sb){
    return notice('config.js არ არის გამართული');
  }

  const email=conf.LOGIN_EMAILS?.[$('#username').value];
  if(!email){
    return notice('მომხმარებელი config.js-ში არ არის');
  }

  const {error}=await sb.auth.signInWithPassword({
    email,
    password:$('#password').value
  });

  if(error){
    notice('შეცდომა: '+error.message);
  }else{
    await start();
  }
};

async function start(){
  if(!sb){
    return notice('Supabase არ არის დაკავშირებული');
  }

  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;

  const {data:name,error}=await sb.rpc('my_name');
  if(error||!name){
    await sb.auth.signOut();
    return notice('წვდომა არ გაქვს');
  }

  $('#identity').textContent=name;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');

  try{
    await reload();
  }catch(e){
    notice('ჩატვირთვის შეცდომა: '+e.message);
  }
}

start();

setInterval(async()=>{
  if(!$('#app').classList.contains('hidden')&&!busy&&!loading){
    try{
      await reload();
    }catch(e){
      console.warn(e);
    }
  }
},30000);
</script>
</body>
</html>
