
<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontier Quartermaster</title>
<style>
:root{
  --dark:#261a15;
  --brown:#473027;
  --gold:#b58b49;
  --paper:#f2e4c9;
  --light:#fff9ed;
  --red:#a72f27;
  --green:#356c46;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#d6c2a0;
  color:var(--dark);
  font:15px Georgia,serif;
}
header{
  background:var(--dark);
  color:var(--paper);
  padding:18px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
h1{font-size:23px;margin:0}
h2{margin:5px 0 15px}
h3{margin:14px 0 8px}
button,input,select{
  font:inherit;
  padding:8px;
  border:1px solid #9c815f;
  border-radius:4px;
  background:var(--light);
  color:var(--dark);
}
button{cursor:pointer}
button:hover{filter:brightness(.94)}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--brown);color:white}
.good{background:var(--green);color:white}
.danger{background:var(--red);color:white}
nav{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  background:var(--brown);
  padding:10px 18px;
}
nav button{background:#e6d1a7}
nav button.active{
  background:var(--gold);
  font-weight:bold;
}
main{
  padding:20px;
  max-width:1650px;
  margin:auto;
}
.panel{
  background:var(--paper);
  border:2px solid #92724d;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 3px 8px #604c3822;
}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:9px;
  margin:12px 0;
}
.scroll{overflow:auto;max-height:73vh}
table{
  width:100%;
  border-collapse:collapse;
  background:var(--light);
}
th,td{
  padding:9px;
  border:1px solid #b8a07a;
  text-align:left;
  vertical-align:top;
}
th{
  background:var(--brown);
  color:white;
  position:sticky;
  top:0;
  z-index:1;
}
tr:nth-child(even) td{background:#f0e2c9}
.red{background:#f4c8bf!important;color:#761b18}
.green{background:#d9ead7!important;color:#225734}
.muted{color:#78634f}
.small{font-size:12px}
.hidden{display:none!important}
.search{width:min(350px,100%)}
.cell{min-width:160px}
.cell select{width:100%}
.issue{
  padding:7px;
  margin-bottom:5px;
  background:#e8b6ac;
  border-left:4px solid var(--red);
}
.issue.returned{
  background:#d9ead7;
  border-color:var(--green);
}
.issue.lost{background:#f4c8bf}
.issue button{font-size:12px;padding:5px;margin:3px 2px 0 0}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.stat{
  display:inline-block;
  background:#f9edda;
  border:1px solid #b49a73;
  padding:12px;
  margin:5px;
  min-width:130px;
}
.stat strong{display:block;font-size:22px}
#login{max-width:530px;margin:65px auto}
#message{
  position:fixed;
  bottom:15px;
  right:15px;
  z-index:10;
  background:#382720;
  color:white;
  padding:13px;
  max-width:450px;
  white-space:pre-wrap;
  display:none;
}
.warning{
  display:inline-block;
  border-radius:4px;
  padding:6px 10px;
  font-weight:bold;
}
.warning.w0{background:#e3d6be}
.warning.w1{background:#f5e6aa}
.warning.w2{background:#efc38c}
.warning.w3{background:#f0a8a0}
@media(max-width:800px){
  main{padding:8px}
  header{display:block}
  h1{font-size:19px}
}
</style>
</head>
<body>

<header>
  <h1>✦ FRONTIER QUARTERMASTER</h1>
  <span id="identity">საწყობის აღრიცხვა</span>
</header>

<div id="login" class="panel">
  <h2>ავტორიზაცია</h2>
  <form id="loginForm" class="toolbar">
    <select id="username" required>
      <option value="">აირჩიე მომხმარებელი</option>
      <option>Billy Westwood</option>
      <option>tyler Westwood</option>
      <option>Satoshi Nikamoto</option>
    </select>
    <input id="password" type="password"
           placeholder="პაროლი" required>
    <button class="primary">შესვლა</button>
  </form>
</div>

<div id="app" class="hidden">
  <nav>
    <button data-page="stock" class="active">საწყობი</button>
    <button data-page="issue">იარაღის გაცემა</button>
    <button data-page="soldiers">ჯარისკაცები</button>
    <button data-page="warnings">საყვედური</button>
    <button data-page="lost">დაკარგული</button>
    <button data-page="summary">დღის შეჯამება</button>
    <button id="logout">გასვლა</button>
  </nav>
  <main id="content"></main>
</div>

<div id="message"></div>
<script src="config.js"></script>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const conf=window.APP_CONFIG||{};
const sb=conf.SUPABASE_URL&&conf.SUPABASE_ANON_KEY
  ?createClient(conf.SUPABASE_URL,conf.SUPABASE_ANON_KEY)
  :null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[c]));

const day=()=>new Intl.DateTimeFormat('en-CA',{
  timeZone:'Europe/Paris',
  year:'numeric',
  month:'2-digit',
  day:'2-digit'
}).format(new Date());

const clock=t=>t?new Date(t).toLocaleString('ka-GE',{
  timeZone:'Europe/Paris',
  day:'2-digit',
  month:'2-digit',
  year:'numeric',
  hour:'2-digit',
  minute:'2-digit'
}):'—';

let page='stock';
let selectedDay=day();
let items=[],soldiers=[],issues=[],warnings=[];
let busy=false,loading=false;
let stockSearch='',soldierSearch='';
let showArchived=false,showRetired=false;

const itemName=id=>items.find(x=>x.id===id)?.name||'—';
const soldierName=id=>soldiers.find(x=>x.id===id)?.name||'—';
const warningCount=id=>warnings.find(x=>x.soldier_id===id)?.warning_count||0;
const used=id=>issues.filter(x=>
  x.item_id===id&&['out','lost'].includes(x.status)
).length;
const available=i=>
  Number(i.initial_qty||0)+Number(i.added_qty||0)-used(i.id);

function notice(t){
  $('#message').textContent=t;
  $('#message').style.display='block';
  clearTimeout(notice.timer);
  notice.timer=setTimeout(()=>{
    $('#message').style.display='none';
  },5500);
}
function setBusy(v){
  busy=v;
  document.querySelectorAll('#content button,#content select')
    .forEach(x=>x.disabled=v);
}

async function reload(){
  if(loading)return;
  loading=true;
  try{
    const r=await Promise.all([
      sb.from('items').select('*').order('name'),
      sb.from('soldiers').select('*').order('name'),
      sb.from('issues').select('*').order('issued_at'),
      sb.from('soldier_warnings').select('*')
    ]);
    for(const x of r)if(x.error)throw x.error;
    [items,soldiers,issues,warnings]=r.map(x=>x.data||[]);
    render();
  }finally{
    loading=false;
  }
}

async function action(kind,args={},mode='original'){
  if(busy)return;
  setBusy(true);
  try{
    let r;

    if(mode==='manage'){
      r=await sb.rpc('warehouse_manage',{
        p_action:kind,
        p_item:args.item||null,
        p_soldier:args.soldier||null,
        p_name:args.name||null,
        p_count:args.count??null
      });
    }else if(mode==='edit'){
      r=await sb.rpc('warehouse_edit',{
        p_action:kind,
        p_item:args.item||null,
        p_issue:args.issue||null,
        p_qty:args.qty??null
      });
    }else{
      r=await sb.rpc('perform_action',{
        p_action:kind,
        p_item:args.item||null,
        p_soldier:args.soldier||null,
        p_issue:args.issue||null,
        p_qty:args.qty??null,
        p_name:args.name||null,
        p_day:args.day||null
      });
    }

    if(r.error)throw r.error;
    await reload();
    notice('შენახულია ✓');
  }catch(e){
    notice('შეცდომა: '+(e.message||e));
  }finally{
    setBusy(false);
  }
}

function dateToolbar(){
  return `<div class="toolbar">
    <b>თარიღი:</b>
    <input type="date" id="day"
      value="${esc(selectedDay)}" max="${day()}">
    <button id="today">დღეს</button>
    <span id="liveClock" class="muted"></span>
  </div>`;
}

function stockPage(){
  const list=items.filter(i=>
    (showArchived||!i.archived)&&
    i.name.toLocaleLowerCase().includes(
      stockSearch.toLocaleLowerCase()
    )
  );

  return `<section class="panel">
    <h2>საწყობი</h2>
    <div class="toolbar">
      <input id="newItem" placeholder="ახალი ნივთის სახელი">
      <button id="addItem" class="primary">ნივთის დამატება</button>
      <input id="stockSearch" class="search"
        placeholder="🔎 ნივთის ძებნა"
        value="${esc(stockSearch)}">
      <label><input type="checkbox" id="showArchived"
        ${showArchived?'checked':''}> წაშლილებიც</label>
    </div>
    <div class="scroll"><table>
      <thead><tr>
        <th>ნივთი</th>
        <th>საწყისი ნაშთი</th>
        <th>დასაბრუნებელი</th>
        <th>დაკარგული</th>
        <th>დარჩენილი</th>
        <th>მოქმედებები</th>
      </tr></thead>
      <tbody>
      ${list.map(i=>`<tr>
        <td>
          <b>${esc(i.name)}</b>
          ${i.archived?'<span class="muted small">(წაშლილი)</span>':''}
        </td>
        <td>${Number(i.initial_qty||0)+Number(i.added_qty||0)}</td>
        <td>${issues.filter(x=>x.item_id===i.id&&x.status==='out').length}</td>
        <td>${issues.filter(x=>x.item_id===i.id&&x.status==='lost').length}</td>
        <td class="${available(i)>0?'green':'red'}">
          <b>${available(i)}</b>
        </td>
        <td>
          ${i.archived?
            `<button class="restoreItem" data-id="${i.id}">აღდგენა</button>`:
            `<div class="actions">
              <input id="q-${i.id}" type="number"
                min="1" max="100000" step="1"
                placeholder="რაოდენობა" style="width:105px">
              <button class="addStock" data-id="${i.id}">+ დამატება</button>
              <button class="renameItem" data-id="${i.id}">სახელის შეცვლა</button>
              <button class="danger archiveItem" data-id="${i.id}">წაშლა</button>
            </div>`}
        </td>
      </tr>`).join('')||
        '<tr><td colspan="6">ნივთი არ მოიძებნა</td></tr>'}
      </tbody>
    </table></div>
  </section>`;
}

function issueCard(x){
  const status=x.status==='out'?'დასაბრუნებელია':
    x.status==='returned'?'დაბრუნდა':'დაიკარგა';

  return `<div class="issue ${x.status==='out'?'':x.status}">
    <b>${esc(itemName(x.item_id))}</b>
    <div class="small">${status}</div>
    <div class="small">${clock(x.issued_at)}</div>
    ${x.status==='out'?`
      <button class="good resolve"
        data-id="${x.id}" data-status="returned">დაბრუნდა</button>
      <button class="danger resolve"
        data-id="${x.id}" data-status="lost">დაიკარგა</button>`:''}
    <button class="cancelIssue" data-id="${x.id}">✕ გაუქმება</button>
  </div>`;
}

function issuePage(){
  const todayRows=issues.filter(x=>
    x.issue_day===selectedDay&&x.status!=='cancelled'
  );

  const list=soldiers.filter(s=>
    (s.active||todayRows.some(x=>x.soldier_id===s.id))&&
    s.name.toLocaleLowerCase().includes(
      soldierSearch.toLocaleLowerCase()
    )
  ).sort((a,b)=>{
    const priority=s=>{
      const rows=todayRows.filter(x=>x.soldier_id===s.id);
      if(rows.some(x=>x.status==='out'))return 3;
      if(rows.some(x=>x.status==='lost'))return 2;
      if(rows.length)return 1;
      return 0;
    };
    return priority(b)-priority(a)||
      a.name.localeCompare(b.name);
  });

  return `<section class="panel">
    <h2>იარაღის გაცემა — ყოველდღიური ჟურნალი</h2>
    ${dateToolbar()}
    <div class="toolbar">
      <input id="soldierSearch" class="search"
        placeholder="🔎 ჯარისკაცის ძებნა"
        value="${esc(soldierSearch)}">
      <span class="muted small">
        გაცემული ნივთების მქონე ჯარისკაცები ზემოთ არიან
      </span>
    </div>
    <div class="scroll"><table>
      <thead><tr>
        <th>ჯარისკაცი</th>
        <th>აღჭურვილობა 1</th>
        <th>აღჭურვილობა 2</th>
        <th>აღჭურვილობა 3</th>
        <th>აღჭურვილობა 4</th>
        <th>მოქმედება</th>
      </tr></thead>
      <tbody>
      ${list.map(s=>{
        const rows=todayRows.filter(x=>x.soldier_id===s.id);
        const active=rows.filter(x=>x.status==='out');
        const ordered=[
          ...active,
          ...rows.filter(x=>x.status==='lost'),
          ...rows.filter(x=>x.status==='returned')
        ];
        const visible=ordered.slice(0,4);

        return `<tr>
          <td>
            <b>${esc(s.name)}</b>
            <div class="small muted">
              ${s.active?'აქტიური':'გაშვებული'}
            </div>
          </td>
          ${[0,1,2,3].map(n=>`<td class="cell">
            ${visible[n]?issueCard(visible[n]):'—'}
          </td>`).join('')}
          <td>
            <div class="small">
              დასაბრუნებელია: <b>${active.length}</b>
            </div>
            ${s.active&&selectedDay===day()&&active.length<4?`
              <select class="give" data-s="${s.id}">
                <option value="">+ ნივთის გაცემა</option>
                ${items.filter(i=>!i.archived&&available(i)>0)
                  .map(i=>`<option value="${i.id}">
                    ${esc(i.name)} (${available(i)})
                  </option>`).join('')}
              </select>`:''}
            <div class="actions" style="margin-top:7px">
              <button class="good bulk"
                data-s="${s.id}" data-status="all_returned"
                ${active.length?'':'disabled'}>ყველას დაბრუნება</button>
              <button class="danger bulk"
                data-s="${s.id}" data-status="all_lost"
                ${active.length?'':'disabled'}>ყველა დაკარგულად</button>
            </div>
            ${ordered.length>4?`
              <div class="small muted">
                კიდევ ${ordered.length-4} ჩანაწერი — იხილე შეჯამება
              </div>`:''}
          </td>
        </tr>`;
      }).join('')||
        '<tr><td colspan="6">ჯარისკაცი არ მოიძებნა</td></tr>'}
      </tbody>
    </table></div>
  </section>`;
}

function soldiersPage(){
  const list=soldiers.filter(s=>showRetired?!s.active:s.active)
    .filter(s=>s.name.toLocaleLowerCase().includes(
      soldierSearch.toLocaleLowerCase()
    ));

  return `<section class="panel">
    <h2>ჯარისკაცები</h2>
    <div class="toolbar">
      <input id="newSoldier" placeholder="სახელი და გვარი">
      <button id="addSoldier" class="primary">ჯარისკაცის დამატება</button>
      <input id="soldierSearch" class="search"
        placeholder="🔎 ჯარისკაცის ძებნა"
        value="${esc(soldierSearch)}">
      <label>
        <input type="checkbox" id="showRetired"
          ${showRetired?'checked':''}>
        გაშვებული ჯარისკაცები
      </label>
    </div>
    <p class="muted small">
      გაშვება ისტორიას არ შლის. ხელახლა მიღებისას ძველი ჩანაწერი აღდგება.
    </p>
    <div class="scroll"><table>
      <thead><tr>
        <th>სახელი და გვარი</th>
        <th>სტატუსი</th>
        <th>გაფრთხილება</th>
        <th>მოქმედებები</th>
      </tr></thead>
      <tbody>
      ${list.map(s=>`<tr>
        <td><b>${esc(s.name)}</b></td>
        <td class="${s.active?'green':'red'}">
          ${s.active?'აქტიური':'გაშვებული'}
        </td>
        <td>${warningCount(s.id)} / 3</td>
        <td>
          <button class="renameSoldier" data-id="${s.id}">
            სახელის შეცვლა
          </button>
          ${s.active?`
            <button class="danger retireSoldier" data-id="${s.id}">
              გაშვება
            </button>`:`
            <button class="good restoreSoldier" data-id="${s.id}">
              ხელახლა მიღება
            </button>`}
        </td>
      </tr>`).join('')||
        '<tr><td colspan="4">ჯარისკაცი არ მოიძებნა</td></tr>'}
      </tbody>
    </table></div>
  </section>`;
}

function warningsPage(){
  const list=soldiers.filter(s=>s.active)
    .filter(s=>s.name.toLocaleLowerCase().includes(
      soldierSearch.toLocaleLowerCase()
    ));

  return `<section class="panel">
    <h2>საყვედური</h2>
    <div class="toolbar">
      <input id="soldierSearch" class="search"
        placeholder="🔎 ჯარისკაცის ძებნა"
        value="${esc(soldierSearch)}">
      <span class="muted small">
        გაფრთხილებების რაოდენობა ინახება Supabase-ში
      </span>
    </div>
    <div class="scroll"><table>
      <thead><tr>
        <th>ჯარისკაცი</th>
        <th>გაფრთხილება</th>
        <th>რაოდენობის შეცვლა</th>
      </tr></thead>
      <tbody>
      ${list.map(s=>{
        const n=warningCount(s.id);
        return `<tr>
          <td><b>${esc(s.name)}</b></td>
          <td>
            <span class="warning w${n}">
              ${n===0?'გაფრთხილება არ აქვს':
                n===1?'ერთი გაფრთხილება':
                n===2?'ორი გაფრთხილება':'სამი გაფრთხილება'}
            </span>
          </td>
          <td>
            <select class="setWarning" data-s="${s.id}">
              ${[0,1,2,3].map(v=>`
                <option value="${v}" ${n===v?'selected':''}>
                  ${v} გაფრთხილება
                </option>`).join('')}
            </select>
          </td>
        </tr>`;
      }).join('')||
        '<tr><td colspan="3">ჯარისკაცი არ მოიძებნა</td></tr>'}
      </tbody>
    </table></div>
  </section>`;
}

function report(rows){
  return `<div class="scroll"><table>
    <thead><tr>
      <th>ჯარისკაცი</th>
      <th>ნივთი</th>
      <th>გაცემის დრო</th>
      <th>გასცა</th>
      <th>სტატუსი</th>
      <th>განახლების დრო</th>
      <th>მოქმედება</th>
    </tr></thead>
    <tbody>
    ${rows.map(x=>`<tr>
      <td>${esc(soldierName(x.soldier_id))}</td>
      <td>${esc(itemName(x.item_id))}</td>
      <td>${clock(x.issued_at)}</td>
      <td>${esc(x.issued_by)}</td>
      <td class="${x.status==='lost'?'red':
        x.status==='returned'?'green':''}">
        ${x.status==='out'?'დასაბრუნებელია':
          x.status==='lost'?'დაიკარგა':'დაბრუნდა'}
      </td>
      <td>${clock(x.resolved_at)}</td>
      <td>
        <button class="cancelIssue" data-id="${x.id}">
          ✕ გაუქმება
        </button>
      </td>
    </tr>`).join('')||
      '<tr><td colspan="7">ჩანაწერები არ არის</td></tr>'}
    </tbody>
  </table></div>`;
}

function lostPage(){
  const rows=issues.filter(x=>
    x.status==='lost'&&x.resolved_day===selectedDay
  );
  return `<section class="panel">
    <h2>დაკარგული ნივთები</h2>
    ${dateToolbar()}
    <p>დაკარგულად დაფიქსირებულია: <b>${rows.length}</b></p>
    ${report(rows)}
  </section>`;
}

function summaryPage(){
  const today=issues.filter(x=>
    x.issue_day===selectedDay&&x.status!=='cancelled'
  );
  const returned=issues.filter(x=>
    x.resolved_day===selectedDay&&x.status==='returned'
  );
  const lost=issues.filter(x=>
    x.resolved_day===selectedDay&&x.status==='lost'
  );
  return `<section class="panel">
    <h2>დღის შეჯამება</h2>
    ${dateToolbar()}
    ${[
      ['გაცემულია',today.length],
      ['დაბრუნდა',returned.length],
      ['დაიკარგა',lost.length],
      ['სულ დასაბრუნებელია',
        issues.filter(x=>x.status==='out').length]
    ].map(x=>`<div class="stat">
      ${x[0]}<strong>${x[1]}</strong>
    </div>`).join('')}
    <h3>არჩეულ დღეს გაცემული ნივთები</h3>
    ${report(today)}
    <h3>ამ დღეს დაბრუნებული ძველი გაცემები</h3>
    ${report(returned.filter(x=>x.issue_day!==selectedDay))}
    <h3>ამ დღეს დაკარგული ძველი გაცემები</h3>
    ${report(lost.filter(x=>x.issue_day!==selectedDay))}
  </section>`;
}

function render(){
  if($('#app').classList.contains('hidden'))return;

  $('#content').innerHTML=
    page==='stock'?stockPage():
    page==='issue'?issuePage():
    page==='soldiers'?soldiersPage():
    page==='warnings'?warningsPage():
    page==='lost'?lostPage():summaryPage();

  document.querySelectorAll('nav [data-page]').forEach(b=>
    b.classList.toggle('active',b.dataset.page===page));

  tick();
}

function tick(){
  const el=$('#liveClock');
  if(el)el.textContent='ახლა: '+clock(new Date());
}
setInterval(tick,1000);

$('#content').addEventListener('input',e=>{
  if(['soldierSearch','stockSearch'].includes(e.target.id)){
    const id=e.target.id;
    const pos=e.target.selectionStart;
    if(id==='stockSearch')stockSearch=e.target.value;
    else soldierSearch=e.target.value;

    render();
    const el=$('#'+id);
    el?.focus();
    el?.setSelectionRange(pos,pos);
  }
});

$('#content').addEventListener('change',async e=>{
  const el=e.target;

  if(el.id==='day'){
    selectedDay=el.value;
    render();
  }else if(el.id==='showArchived'){
    showArchived=el.checked;
    render();
  }else if(el.id==='showRetired'){
    showRetired=el.checked;
    render();
  }else if(el.classList.contains('give')&&el.value){
    const item=el.value;
    const soldier=el.dataset.s;
    el.value='';
    await action('issue',{item,soldier,day:selectedDay});
  }else if(el.classList.contains('setWarning')){
    await action('set_warning',{
      soldier:el.dataset.s,
      count:Number(el.value)
    },'manage');
  }
});

$('#content').addEventListener('click',async e=>{
  const b=e.target.closest('button');
  if(!b||busy)return;

  const id=b.dataset.id;

  if(b.id==='today'){
    selectedDay=day();
    render();

  }else if(b.id==='addItem'){
    const name=$('#newItem').value.trim();
    if(name.length>=2)await action('add_item',{name});
    else notice('შეიყვანე ნივთის სახელი');

  }else if(b.id==='addSoldier'){
    const name=$('#newSoldier').value.trim();
    if(name.length>=2){
      await action('add_soldier',{name},'manage');
    }else{
      notice('შეიყვანე სახელი და გვარი');
    }

  }else if(b.classList.contains('addStock')){
    const qty=Number($('#q-'+id).value);
    if(Number.isInteger(qty)&&qty>0&&qty<=100000){
      await action('stock',{item:id,qty},'edit');
    }else{
      notice('შეიყვანე სწორი რაოდენობა');
    }

  }else if(b.classList.contains('renameItem')){
    const old=itemName(id);
    const name=prompt('ნივთის ახალი დასახელება:',old);
    if(name!==null&&name.trim()&&name.trim()!==old){
      await action('rename_item',{
        item:id,name:name.trim()
      },'manage');
    }

  }else if(b.classList.contains('archiveItem')){
    await action('archive_item',{item:id},'edit');

  }else if(b.classList.contains('restoreItem')){
    await action('restore_item',{item:id},'edit');

  }else if(b.classList.contains('renameSoldier')){
    const old=soldierName(id);
    const name=prompt('ჯარისკაცის ახალი სახელი:',old);
    if(name!==null&&name.trim()&&name.trim()!==old){
      await action('rename_soldier',{
        soldier:id,name:name.trim()
      },'manage');
    }

  }else if(b.classList.contains('retireSoldier')){
    await action('retire_soldier',{soldier:id},'manage');

  }else if(b.classList.contains('restoreSoldier')){
    await action('restore_soldier',{soldier:id},'manage');

  }else if(b.classList.contains('cancelIssue')){
    await action('cancel_issue',{issue:id},'edit');

  }else if(b.classList.contains('resolve')){
    await action(b.dataset.status,{issue:id});

  }else if(b.classList.contains('bulk')){
    await action(b.dataset.status,{
      soldier:b.dataset.s,
      day:selectedDay
    });
  }
});

document.querySelectorAll('nav [data-page]').forEach(b=>
  b.addEventListener('click',()=>{
    page=b.dataset.page;
    render();
  })
);

$('#logout').onclick=async()=>{
  await sb.auth.signOut();
  location.reload();
};

$('#loginForm').onsubmit=async e=>{
  e.preventDefault();

  if(!sb)return notice('config.js არ არის გამართული');

  const email=conf.LOGIN_EMAILS?.[$('#username').value];
  if(!email)return notice('მომხმარებელი config.js-ში არ არის');

  const {error}=await sb.auth.signInWithPassword({
    email,
    password:$('#password').value
  });

  if(error)notice('შეცდომა: '+error.message);
  else await start();
};

async function start(){
  if(!sb)return notice('Supabase არ არის დაკავშირებული');

  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;

  const {data:name,error}=await sb.rpc('my_name');
  if(error||!name){
    await sb.auth.signOut();
    return notice('წვდომა აკრძალულია');
  }

  $('#identity').textContent=name;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');

  try{
    await reload();
  }catch(e){
    notice('ჩატვირთვის შეცდომა: '+e.message);
  }
}

start();

setInterval(async()=>{
  if(!$('#app').classList.contains('hidden')&&!busy&&!loading){
    try{
      if(selectedDay!==day()&&page==='issue'){
        selectedDay=day();
      }
      await reload();
    }catch(e){
      console.warn(e);
    }
  }
},30000);
</script>
</body>
</html>
